<main class="app">
  <h1>QR Code Generator</h1>

  <div class="card">
    <textarea
      [(ngModel)]="text"
      placeholder="テキストまたは URL を入力"
      rows="4"
    ></textarea>

    <button class="generate" (click)="generate()">生成</button>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    @if (qrDataUrl) {
      <div class="result">
        <img [src]="qrDataUrl" alt="生成された QR コード">
        <a class="download" [href]="qrDataUrl" download="qrcode.png">
          ダウンロード
        </a>
      </div>
    }
  </div>
</main>
